name: Build Telegram Unsigned IPA (official servers)

# Builds an unsigned iOS .ipa of the stock Telegram-iOS client in GitHub Actions.
# This fork keeps Telegram's official datacenters, official RSA keys and official
# branding: the only modifications are the unsigned-sideload crash guards from
# the upstream template. The output is intentionally unsigned: it is signed at
# install time with a free Apple ID via Sideloadly / AltStore / 3uTools.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 720
    env:
      # Pinned upstream commit (Telegram 12.9.2), same as the template repo.
      UPSTREAM_REF: 6ad963e5b62d354da79040f388ae2b9132fb17b8

      # Keep the stock Telegram name in the UI.
      CUSTOM_APP_NAME: Telegram

      # A distinct bundle id so the sideloaded build can coexist with the
      # App Store Telegram (and so a free Apple ID can provision it).
      CUSTOM_BUNDLE_ID: com.tgself.messenger

      # Locales kept in the shipped IPA (Chinese included).
      IPA_KEEP_LOCALES: Base,en,zh

      # Extensions removed to keep the unsigned IPA small enough to sideload.
      IPA_DROP_PLUGINS: Watch,Widget,BroadcastUpload,Share,Notification,Intents

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Restore Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/bazel-disk-cache
          key: bazel-disk-cache-${{ runner.os }}-${{ env.UPSTREAM_REF }}-v1
          restore-keys: |
            bazel-disk-cache-${{ runner.os }}-${{ env.UPSTREAM_REF }}-

      - name: Clone upstream Telegram iOS
        run: |
          set -euxo pipefail
          git clone -j8 --filter=blob:none https://github.com/TelegramMessenger/Telegram-iOS.git "$RUNNER_TEMP/telegram-ios"
          git -C "$RUNNER_TEMP/telegram-ios" checkout "$UPSTREAM_REF"
          git -C "$RUNNER_TEMP/telegram-ios" submodule sync --recursive
          git -C "$RUNNER_TEMP/telegram-ios" submodule update --init --recursive --jobs 8

      - name: Apply unsigned-sideload crash guards
        run: |
          set -euxo pipefail
          bash "$GITHUB_WORKSPACE/scripts/apply_mods.sh" "$RUNNER_TEMP/telegram-ios"

      - name: Set active Xcode version
        run: |
          set -euxo pipefail
          SOURCE_DIR="$RUNNER_TEMP/telegram-ios"
          XCODE_VERSION=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["xcode"])' "$SOURCE_DIR/versions.json")
          XCODE_MAJOR="${XCODE_VERSION%%.*}"
          DEFAULT_XCODE="/Applications/Xcode.app/Contents/Developer"
          DEFAULT_VERSION=""
          if [[ -d "$DEFAULT_XCODE" ]]; then
            DEFAULT_VERSION="$("$DEFAULT_XCODE/usr/bin/xcodebuild" -version 2>/dev/null | awk '/^Xcode/{print $2}')"
          fi
          echo "versions.json wants Xcode $XCODE_VERSION (major $XCODE_MAJOR); image default is ${DEFAULT_VERSION:-none}"
          ls -d /Applications/Xcode*.app || true

          SELECTED_DEVELOPER=""

          if [[ -n "$DEFAULT_VERSION" && "${DEFAULT_VERSION%%.*}" == "$XCODE_MAJOR" ]]; then
            SELECTED_DEVELOPER="$DEFAULT_XCODE"
          fi

          if [[ -z "$SELECTED_DEVELOPER" && -d "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer/Platforms/iPhoneOS.platform" ]]; then
            SELECTED_DEVELOPER="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          fi

          if [[ -z "$SELECTED_DEVELOPER" ]]; then
            for candidate in /Applications/Xcode_${XCODE_MAJOR}.*.app/Contents/Developer; do
              if [[ -d "$candidate/Platforms/iPhoneOS.platform" ]]; then
                SELECTED_DEVELOPER="$candidate"
              fi
            done
          fi

          if [[ -z "$SELECTED_DEVELOPER" ]]; then
            echo "No installed Xcode has a usable iOS platform" >&2
            exit 1
          fi

          echo "Using Xcode developer dir: $SELECTED_DEVELOPER"
          sudo xcode-select -s "$SELECTED_DEVELOPER"
          xcodebuild -version
          echo "--- iphoneos SDK in use ---"
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Free disk space
        run: |
          set -euxo pipefail
          echo "--- before ---"
          df -h /
          sudo rm -rf ~/Library/Developer/Xcode/DerivedData || true
          rm -rf ~/.cache/* || true
          echo "--- after ---"
          df -h /

      - name: Build unsigned IPA
        env:
          BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
        run: |
          set -euxo pipefail
          SOURCE_DIR="$RUNNER_TEMP/telegram-ios"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat "$SOURCE_DIR/build_number_offset")"
          APP_VERSION="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["app"])' "$SOURCE_DIR/versions.json")"
          COMMIT_COUNT="$(git -C "$SOURCE_DIR" rev-list --count HEAD)"
          TGSELF_BUILD_BASE=900000
          BUILD_NUMBER="$((TGSELF_BUILD_BASE + COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          BAZEL_CACHE_DIR="$RUNNER_TEMP/bazel-disk-cache"
          mkdir -p "$BAZEL_CACHE_DIR"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          # Refresh fake-codesigning profiles from the latest upstream branch.
          LATEST_PROFILE_REF="origin/master"
          if ! git -C "$SOURCE_DIR" rev-parse --verify "$LATEST_PROFILE_REF" >/dev/null 2>&1; then
            LATEST_PROFILE_REF="origin/main"
          fi
          for profile in Telegram Intents NotificationContent NotificationService Share WatchApp WatchExtension Widget BroadcastUpload; do
            git -C "$SOURCE_DIR" show "$LATEST_PROFILE_REF:build-system/fake-codesigning/profiles/${profile}.mobileprovision" \
              > "$SOURCE_DIR/build-system/fake-codesigning/profiles/${profile}.mobileprovision"
          done

          # Keep dSYM generation, drop --objc_enable_binary_stripping (it was the
          # root cause of late-stage crashes in the template's builds; see their
          # README #4/#5 for the full post-mortem).
          python3 - <<'PY'
          import pathlib
          import re

          make_path = pathlib.Path("build-system/Make/Make.py")
          text = make_path.read_text()
          for marker in ("'--apple_generate_dsym',", "'--output_groups=+dsyms',"):
              print(f"dSYM flag present in Make.py: {marker} -> {marker in text}")

          pattern = re.compile(r"^[ \t]*'--objc_enable_binary_stripping',[ \t]*\r?\n", re.M)
          found = pattern.findall(text)
          if len(found) != 1:
              raise SystemExit(
                  "objc stripping: expected exactly one flag line in Make.py, found %d" % len(found))
          make_path.write_text(pattern.sub("", text))
          print("objc stripping disabled: removed '--objc_enable_binary_stripping' from Make.py")
          print("mentions left in Make.py: %d"
                % make_path.read_text().count("--objc_enable_binary_stripping"))
          PY

          python3 "$SOURCE_DIR/build-system/Make/ImportCertificates.py" --path "$SOURCE_DIR/build-system/fake-codesigning/certs"

          python3 -u "$SOURCE_DIR/build-system/Make/Make.py" \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --overrideXcodeVersion \
            --cacheDir="$BAZEL_CACHE_DIR" \
            build \
            --configurationPath="$SOURCE_DIR/build-system/appstore-configuration.json" \
            --codesigningInformationPath="$SOURCE_DIR/build-system/fake-codesigning" \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$SOURCE_DIR/build/artifacts" \
            --buildNumber="$BUILD_NUMBER"

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          SOURCE_DIR="$RUNNER_TEMP/telegram-ios"
          OUTPUT_DIR="$RUNNER_TEMP/artifacts"
          ARTIFACTS_DIR="$SOURCE_DIR/build/artifacts"
          WORK_DIR="$RUNNER_TEMP/tg-ipa-work"
          mkdir -p "$OUTPUT_DIR"

          IPA_PATH=""
          for candidate in "$ARTIFACTS_DIR/Telegram.ipa" "$ARTIFACTS_DIR"/*.ipa; do
            if [[ -f "$candidate" ]]; then
              IPA_PATH="$candidate"
              break
            fi
          done
          if [[ -z "$IPA_PATH" ]]; then
            echo "No IPA produced. Searching the source tree..." >&2
            IPA_PATH="$(find "$SOURCE_DIR/build" -name '*.ipa' -type f -print -quit 2>/dev/null || true)"
          fi
          if [[ -z "$IPA_PATH" ]]; then
            echo "No IPA found anywhere under $SOURCE_DIR/build" >&2
            ls -la "$SOURCE_DIR/build" 2>/dev/null || true
            exit 1
          fi
          echo "Using IPA: $IPA_PATH"

          rm -rf "$WORK_DIR"
          mkdir -p "$WORK_DIR"
          ditto -x -k "$IPA_PATH" "$WORK_DIR"

          export WORK_DIR
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          work_dir = Path(os.environ["WORK_DIR"])
          app_name = os.environ["CUSTOM_APP_NAME"]
          old_bundle = "ph.telegra.Telegraph"
          new_bundle = os.environ["CUSTOM_BUNDLE_ID"]

          def transform(value):
              if isinstance(value, str):
                  return value.replace(old_bundle, new_bundle)
              if isinstance(value, list):
                  return [transform(v) for v in value]
              if isinstance(value, dict):
                  return {k: transform(v) for k, v in value.items()}
              return value

          payload_dir = work_dir / "Payload"
          app_dirs = list(payload_dir.glob("*.app"))
          if len(app_dirs) != 1:
              raise SystemExit(f"Expected exactly one .app in Payload, found: {app_dirs}")

          app_dir = app_dirs[0]
          plist_files = [app_dir / "Info.plist"]
          plist_files.extend(app_dir.glob("PlugIns/*.appex/Info.plist"))
          plist_files.extend(app_dir.glob("Frameworks/*.framework/Info.plist"))

          for plist_path in plist_files:
              if not plist_path.exists():
                  continue
              with plist_path.open("rb") as f:
                  data = plistlib.load(f)

              data = transform(data)

              if plist_path == app_dir / "Info.plist":
                  # Keep the stock Telegram display name; only the bundle id
                  # changes so it can be provisioned by a free Apple ID.
                  data["CFBundleDisplayName"] = app_name
                  data["CFBundleName"] = app_name
                  # URL schemes are left untouched: telegram / tg / tonsite
                  # stay stock so tg:// links behave exactly like the official app.

              with plist_path.open("wb") as f:
                  plistlib.dump(data, f, sort_keys=False)

          PY

          bash "$GITHUB_WORKSPACE/scripts/slim_ipa.sh" "$WORK_DIR"

          find "$WORK_DIR/Payload" -type d -name "_CodeSignature" -prune -exec rm -rf {} +
          find "$WORK_DIR/Payload" -type f -name "embedded.mobileprovision" -delete

          rm -f "$OUTPUT_DIR/Telegram-unsigned.ipa"
          (
            cd "$WORK_DIR"
            /usr/bin/zip -q -r -y -9 "$OUTPUT_DIR/Telegram-unsigned.ipa" Payload
          )

          if [[ -f "$ARTIFACTS_DIR/Telegram.DSYMs.zip" ]]; then
            cp "$ARTIFACTS_DIR/Telegram.DSYMs.zip" "$OUTPUT_DIR/Telegram.DSYMs.zip"
            echo "dSYM archive collected: $(du -h "$OUTPUT_DIR/Telegram.DSYMs.zip" | cut -f1)"
          else
            echo "note: no dSYM archive produced" >&2
            find "$SOURCE_DIR/build" -name '*.dSYM' -maxdepth 4 2>/dev/null || true
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-unsigned-ipa-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/artifacts
          if-no-files-found: error
